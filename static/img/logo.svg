<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Robot head -->
  <rect x="60" y="40" width="80" height="80" rx="10" fill="url(#grad1)"/>
  <!-- Eyes -->
  <circle cx="80" cy="70" r="8" fill="white"/>
  <circle cx="120" cy="70" r="8" fill="white"/>
  <!-- Antenna -->
  <line x1="100" y1="40" x2="100" y2="20" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="20" r="6" fill="#2563eb"/>
  <!-- Body -->
  <rect x="70" y="120" width="60" height="50" rx="8" fill="url(#grad1)"/>
  <!-- Arms -->
  <rect x="40" y="130" width="25" height="8" rx="4" fill="#2563eb"/>
  <rect x="135" y="130" width="25" height="8" rx="4" fill="#2563eb"/>
  <!-- Legs -->
  <rect x="75" y="170" width="15" height="25" rx="4" fill="#7c3aed"/>
  <rect x="110" y="170" width="15" height="25" rx="4" fill="#7c3aed"/>
</svg>
